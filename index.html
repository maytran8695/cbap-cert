<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBAP Mock Exam Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <h1>CBAP Mock Exam Trainer</h1>
      <p class="subtitle">Luyện đề CBAP theo BABOK v3 — KA3–KA8</p>
    </header>

    <div class="card">
      <h2>1. Chọn bộ đề</h2>
      <div class="option-grid" id="source-select">
        <label class="pill-radio">
          <input type="radio" name="source" value="set1" checked>
          <span>Standard <small id="count-set1"></small></span>
        </label>
        <label class="pill-radio">
          <input type="radio" name="source" value="set2">
          <span>Advanced Set 2 <small id="count-set2"></small></span>
        </label>
        <label class="pill-radio">
          <input type="radio" name="source" value="set3">
          <span>Expert <small id="count-set3"></small></span>
        </label>
        <label class="pill-radio">
          <input type="radio" name="source" value="mixed">
          <span>Trộn cả 3 bộ <small>(360 câu)</small></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>2. Lọc theo Knowledge Area</h2>
      <div class="option-grid" id="ka-select">
        <label class="chip"><input type="checkbox" value="KA3" checked> KA3 — Planning &amp; Monitoring</label>
        <label class="chip"><input type="checkbox" value="KA4" checked> KA4 — Elicitation &amp; Collaboration</label>
        <label class="chip"><input type="checkbox" value="KA5" checked> KA5 — Requirements Life Cycle Mgmt</label>
        <label class="chip"><input type="checkbox" value="KA6" checked> KA6 — Strategy Analysis</label>
        <label class="chip"><input type="checkbox" value="KA7" checked> KA7 — Requirements Analysis &amp; Design</label>
        <label class="chip"><input type="checkbox" value="KA8" checked> KA8 — Solution Evaluation</label>
      </div>
      <div class="ka-actions">
        <button type="button" class="link-btn" id="ka-select-all">Chọn tất cả</button>
        <button type="button" class="link-btn" id="ka-select-none">Bỏ chọn tất cả</button>
      </div>
    </div>

    <div class="card">
      <h2>3. Chế độ làm bài</h2>
      <div class="option-grid" id="mode-select">
        <label class="pill-radio">
          <input type="radio" name="mode" value="practice" checked>
          <span>Practice <small>Xem đáp án ngay</small></span>
        </label>
        <label class="pill-radio">
          <input type="radio" name="mode" value="exam">
          <span>Exam <small>Làm hết mới chấm, có đồng hồ</small></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <button id="btn-start" class="btn btn-primary">Bắt đầu làm bài</button>
        <button id="btn-review" class="btn btn-secondary" disabled>Ôn lại câu sai / đã đánh dấu (<span id="review-count">0</span>)</button>
      </div>
    </div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-topbar">
      <div class="quiz-progress">
        <span id="quiz-position">Câu 1 / 120</span>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div id="quiz-timer" class="quiz-timer hidden">03:00:00</div>
      <button id="btn-exit-quiz" class="btn btn-ghost">Thoát</button>
    </div>

    <div class="card question-card">
      <div class="question-meta">
        <span class="ka-tag" id="question-ka"></span>
        <button id="btn-bookmark" class="bookmark-btn" title="Đánh dấu câu này để ôn lại">☆</button>
      </div>
      <p class="question-text" id="question-text"></p>
      <div id="options-list" class="options-list"></div>
      <div id="explanation-box" class="explanation-box hidden"></div>
    </div>

    <div class="quiz-nav">
      <button id="btn-prev" class="btn btn-secondary">← Câu trước</button>
      <button id="btn-next" class="btn btn-primary">Câu tiếp →</button>
      <button id="btn-submit" class="btn btn-danger hidden">Nộp bài</button>
    </div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="screen-result" class="screen hidden">
    <div class="card result-summary">
      <h2>Kết quả</h2>
      <div class="score-big" id="score-big">0/0</div>
      <div class="score-pct" id="score-pct">0%</div>
    </div>

    <div class="card">
      <h3>Kết quả theo Knowledge Area</h3>
      <table class="ka-table" id="ka-table"></table>
    </div>

    <div class="card">
      <div class="row-between">
        <h3>Chi tiết từng câu</h3>
        <label class="chip"><input type="checkbox" id="filter-wrong-only"> Chỉ hiện câu sai</label>
      </div>
      <div id="review-list"></div>
    </div>

    <div class="card">
      <div class="row-between">
        <button id="btn-review-wrong-now" class="btn btn-secondary">Ôn ngay câu sai của lần này</button>
        <button id="btn-back-home" class="btn btn-primary">Về trang chủ</button>
      </div>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
